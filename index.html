<!DOCTYPE html>

    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #8b949e;
        }
        .input-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 6px;
            flex-grow: 1;
            outline: none;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240,246,2fc,0.1);
            border-radius: 6px;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea043;
        }
        .error {
            color: #ff7b72;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .success-box {
            display: none;
            background-color: #1f242c;
            border: 1px solid #238636;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);

        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
